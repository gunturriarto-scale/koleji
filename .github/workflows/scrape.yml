name: KOL Scraper

on:
  schedule:
    - cron: '0 16 */3 * *'  # 23:00 WIB setiap 3 hari
  workflow_dispatch: {}       # trigger manual dari GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build

      - name: Setup Google Service Account
        run: |
          mkdir -p keys
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > keys/service-account.json

      - name: Run scraper
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_PATH: ./keys/service-account.json
          BATCH_SIZE: 400
        run: node dist/index.js --once
